<style>
  :root{
    --bg1:#FDF6EC; --bg2:#F3E9F8; --bg3:#E4F1EC;
    --card:#ffffff; --card2:#FBF7F0; --line:#EAD9C0;
    --txt:#4A3F33; --muted:#A8998A;
    --acc:#5FBFA0; --acc-ink:#123A2E;
    --acc2:#6FA8DC; --purple:#B39DDB; --pink:#F2A7C3;
    --warn:#F5D488; --err:#E38B9A; --gold:#E8B75E;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;
       background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
       background-attachment:fixed;
       color:var(--txt);font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  @media (min-width:768px){ .wrap{max-width:700px} }
  @media (min-width:1100px){ .wrap{max-width:920px;padding:24px} }
  h1,h2,h3{margin:0 0 8px;font-family:'Baloo 2',system-ui,sans-serif}
  h1{font-size:26px} h2{font-size:20px} h3{font-size:15px;color:var(--purple);font-weight:700}
  .card-sinfondo{background:transparent!important;border:none!important;box-shadow:none!important;padding:16px 4px 4px}
  .card-sinfondo h1{text-shadow:0 2px 16px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.65)}
  .card-sinfondo p{text-shadow:0 1px 8px rgba(0,0,0,.55)}
  .card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;
        box-shadow:0 6px 16px rgba(60,20,0,.12)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  input,select,button,textarea{font:inherit}
  input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--line);
       background:var(--card2);color:var(--txt);margin-bottom:10px}
  button{padding:11px 16px;border-radius:14px;border:none;background:var(--acc2);color:#fff;font-weight:800;
       font-family:'Baloo 2',system-ui,sans-serif;letter-spacing:.2px;
       cursor:pointer;transition:transform .1s,opacity .15s;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  button:active{transform:translateY(2px);box-shadow:none}
  .btn-acc{background:var(--acc);color:var(--acc-ink)} .btn-warn{background:var(--warn);color:#4a2e00}
  .btn-err{background:var(--err);color:#fff} .btn-ghost{background:var(--card2);border:2px solid var(--line);color:var(--txt);box-shadow:none}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:10px}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;font-family:'Baloo 2',sans-serif}
  .pill-live{background:#d4f7ea;color:#04895e} .pill-wait{background:#e0ecff;color:#2a5cd6}
  .teaser-card{background:linear-gradient(120deg,var(--purple),var(--pink));border:none;color:#fff;position:relative;overflow:hidden}
  .teaser-card::after{content:'✨';position:absolute;top:-6px;right:8px;font-size:60px;opacity:.25}
  .teaser-badge{display:inline-block;background:rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:11px;letter-spacing:.5px;padding:3px 10px;border-radius:999px;margin-bottom:6px}
  .teaser-card h3{color:#fff!important}
  .teaser-card p{color:rgba(255,255,255,.9)!important;margin:0}
  .pill-tie{background:#fff1c9;color:#a6720a} .pill-done{background:#eee;color:#888}
  .pill-err{background:#fde2e1;color:#c0392b}
  .frases-row{display:flex;flex-wrap:wrap;gap:6px}
  #chat_burbujas{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:500;
    display:flex;flex-direction:column;gap:6px;max-width:90vw;pointer-events:none}
  .chat-burbuja{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;
    font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.15);animation:burbujaIn .2s ease-out}
  .chat-burbuja.mia{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  @keyframes burbujaIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .err-box{background:#ffe1e9;border:2px solid var(--err);color:#a5123a;padding:10px 12px;border-radius:14px;margin-bottom:10px;font-size:14px;font-weight:700}
  .ok-box{background:#d9fbee;border:2px solid var(--acc);color:#04895e;padding:10px 12px;border-radius:14px;margin-bottom:10px;font-size:14px;font-weight:700}
  .hide{display:none !important}
  .tabs{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;padding:10px 0;z-index:5}
  .tab{flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.85);color:var(--muted);
       font-size:13px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;border:2px solid transparent}
  .tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}
  .balls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .ball{width:36px;height:36px;border-radius:50%;background:var(--card2);border:2px solid var(--line);
        display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:'Baloo 2',sans-serif;color:var(--purple)}
  .ball.last{background:linear-gradient(135deg,var(--acc),#04b589);color:#fff;transform:scale(1.2);box-shadow:0 0 0 3px #06d6a055}
  .carton{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:10px}
  .cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .chead{text-align:center;font-weight:800;font-size:13px;color:var(--acc2);padding:2px 0;font-family:'Baloo 2',sans-serif}
  .cnum{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff;
        border-radius:8px;font-size:12.5px;font-weight:700}
  .cnum.marked{background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#4a2e00;font-weight:900}
  .qty{display:flex;align-items:center;gap:10px;margin:10px 0}
  .qty button{width:38px;height:38px;padding:0;font-size:18px;flex:none}
  .qty .n{flex:1;text-align:center;font-size:20px;font-weight:800}
  .envs{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin:10px 0}
  .env{aspect-ratio:3/4;background:linear-gradient(135deg,var(--purple),var(--pink));border:2px solid var(--line);
       border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
  .env.taken{opacity:.3;cursor:not-allowed}
  .env.mine{border-color:var(--acc);box-shadow:0 0 0 3px #06d6a055}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff5;border-top-color:#fff;
        border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
          background:rgba(255,255,255,.9);border-radius:16px;padding:10px 14px}

  a.link{color:var(--acc2);cursor:pointer;text-decoration:underline;font-size:13.5px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 4px;border-bottom:2px solid var(--line);text-align:left}
  th{font-family:'Baloo 2',sans-serif;color:var(--purple)}

  /* --- Celebración de premio: confeti + modal --- */
  .confetti{position:fixed;top:-20px;z-index:1000;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.25}}
  .celebrate-overlay{position:fixed;inset:0;background:rgba(40,10,30,.6);display:flex;align-items:center;
        justify-content:center;z-index:999;padding:20px;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .celebrate-box{background:#fff;border-radius:26px;padding:30px 22px;text-align:center;max-width:340px;width:100%;
        box-shadow:0 20px 60px rgba(0,0,0,.4);animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes popIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .celebrate-box h1{font-size:30px;margin:0 0 10px;
        background:linear-gradient(90deg,var(--pink),var(--purple),var(--acc2));
        -webkit-background-clip:text;background-clip:text;color:transparent;
        animation:wiggle 1.2s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .celebrate-prize{font-size:17px;font-weight:800;margin:4px 0;font-family:'Baloo 2',sans-serif}
  .celebrate-amount{font-size:28px;font-weight:900;color:var(--acc-ink);margin:12px 0;font-family:'Baloo 2',sans-serif}
  .celebrate-box button{margin-top:8px;width:100%}

  /* --- Layout de juego en vivo: 65% cartones / 35% tablero de bolas --- */
  .juego-live-grid{display:flex;gap:10px;align-items:flex-start}
  .col-bolas{flex:0 0 35%;max-width:35%;min-width:0}
  .col-cartones{flex:1 1 65%;max-width:65%;min-width:0}
  .col-bolas .card,.col-cartones .card{padding:10px}
  @media (max-width:380px){
    .juego-live-grid{flex-direction:column}
    .col-bolas,.col-cartones{flex:1 1 100%;max-width:100%}
  }

  /* Tablero clásico compacto B-I-N-G-O */
  .bolas-board{display:flex;gap:3px;justify-content:space-between}
  .bcol{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .bcol-head{text-align:center;font-weight:800;font-size:11px;color:var(--acc2);font-family:'Baloo 2',sans-serif}
  .bcell{text-align:center;font-size:8.5px;padding:2px 0;border-radius:4px;background:var(--card2);color:var(--muted);line-height:1.2}
  .bcell.marked{background:var(--acc);color:#fff;font-weight:800}
  .bcell.last{background:var(--gold);color:#4a2e00;font-weight:900;font-size:12px;position:relative;z-index:1;
        transform:scale(1.3);box-shadow:0 0 0 2px #fff,0 0 10px rgba(255,183,3,.8);animation:pulseLast 1s ease-in-out infinite}
  @keyframes pulseLast{0%,100%{transform:scale(1.3)}50%{transform:scale(1.45)}}

  /* Cuadrícula de cartones que se adapta a la cantidad comprada */
  .cartones-grid{display:grid;gap:calc(10px*var(--n-scale,1))}
  .cartones-grid .carton{margin-bottom:0;padding:calc(8px*var(--n-scale,1));position:relative}
  .cartones-grid .chead{font-size:calc(13px*var(--n-scale,1))}
  .cartones-grid .cnum{font-size:calc(12.5px*var(--n-scale,1))}

  /* Aviso de "ya casi" (tabla llena a 1-2 números) */
  .carton{position:relative}
  .carton-badge{position:absolute;top:-8px;right:-8px;background:linear-gradient(135deg,var(--err),var(--pink));
        color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;
        box-shadow:0 3px 8px rgba(0,0,0,.25);animation:pulseBadge 1s ease-in-out infinite;z-index:2;white-space:nowrap}
  .carton-badge.hide{display:none}
  @keyframes pulseBadge{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* Parpadeo de línea (azul) y de 4 esquinas (rosa) próximas a completarse */
  .cnum.blink-line{--blink-color:var(--acc2);animation:blinkRing .8s ease-in-out infinite}
  .cnum.blink-corner{--blink-color:var(--pink);animation:blinkRing .8s ease-in-out infinite}
  @keyframes blinkRing{0%,100%{box-shadow:0 0 0 2px transparent}50%{box-shadow:0 0 0 3px var(--blink-color)}}

  /* --- Selector de tema (botón flotante) --- */
  #theme_fab{position:fixed;bottom:14px;right:14px;z-index:200}
  #wsp_fab{position:fixed;bottom:14px;left:14px;z-index:200;width:46px;height:46px;border-radius:50%;
    background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);text-decoration:none}
  .theme-fab-btn{width:46px;height:46px;border-radius:50%;font-size:20px;padding:0;
        box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
  .theme-panel{position:absolute;bottom:56px;right:0;background:#fff;border-radius:18px;padding:12px;
        display:flex;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);align-items:center}
  .theme-panel.hide{display:none}
  .theme-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid #fff;
        box-shadow:0 0 0 2px #ddd;transition:transform .15s}
  .theme-swatch:active{transform:scale(.9)}
  .theme-swatch.active{box-shadow:0 0 0 3px var(--acc2,#333)}

  /* Cartón que ya ganó Línea o 4 Esquinas */
  .carton.ganador-linea{border-color:var(--acc2)!important;background:#e8f4ff}
  .carton.ganador-esquinas{border-color:var(--pink)!important;background:#fce8f3}
  .carton.ganador-linea.ganador-esquinas{border-color:var(--gold)!important;background:#fff6e0}
  .carton.ganador-tabla{border-color:var(--acc)!important;box-shadow:0 0 0 2px var(--acc)}

  /* Layout móvil: número grande arriba */
  .bola-actual-movil{display:none;text-align:center;font-size:40px;font-weight:900;
    font-family:'Baloo 2',sans-serif;padding:14px;margin-bottom:10px;
    background:var(--card2);border:2px solid var(--line);border-radius:16px;color:var(--acc-ink)}
  .bola-actual-movil .sub{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
  @media (max-width:600px){
    .juego-live-grid{flex-direction:column}
    .col-bolas,.col-cartones{flex:1 1 100%;max-width:100%}
    .bola-actual-movil{display:block}
    .col-bolas .card h3{font-size:13px}
  }

  /* --- Recargas / retiros / alarma --- */
  button:disabled{opacity:.55;cursor:not-allowed}
  .demo-box{background:#fff6e0;border:2px dashed var(--gold);color:#7a5200;padding:8px 10px;border-radius:12px;font-size:13px;margin:8px 0}
  .pend-box{background:#e0ecff;border:2px solid var(--acc2);color:#1f3f8a;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:14px}
  .qr-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
  .qr-card{flex:1 1 140px;text-align:center;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:10px}
  .qr-img{width:100%;max-width:170px;border-radius:8px}
  .qr-ph{width:100%;max-width:170px;aspect-ratio:1/1;margin:0 auto 6px;border:3px dashed var(--line);border-radius:10px;
         display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:var(--muted)}
  #alarma-bar{position:sticky;top:0;z-index:9999;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;
         background:#c0392b;color:#fff;padding:10px 12px;font-weight:800;font-size:14px;animation:alarmaPulso 1s ease-in-out infinite}
  #alarma-bar button{background:#fff;color:#c0392b;box-shadow:none}
  @keyframes alarmaPulso{0%,100%{background:#c0392b}50%{background:#e74c3c}}

  /* --- ¿Jugamos? --- */
  #jugamos-bar{position:fixed;left:8px;right:8px;top:8px;z-index:9998;background:#1e8e3e;color:#fff;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #jugamos-bar button{background:#fff;color:#111;box-shadow:none}
  .badge-n{background:#e74c3c;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:4px}
  .ojito{position:absolute!important;right:4px;top:0;bottom:0;width:auto!important;padding:0 12px!important;background:transparent!important;box-shadow:none!important;border:none!important;font-size:18px;line-height:1;color:var(--txt)!important;margin:0!important;display:flex;align-items:center}
  .ojito:active{transform:none!important}
  .sala-hero{background:linear-gradient(135deg,#fff7e6,#ffe9f3 60%,#e8f4ff);border:2px solid var(--line)}
  .sala-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sala-cd{text-align:center;background:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .sala-cd .cd{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:800;color:var(--acc2);line-height:1.1}
  .prog{height:12px;border-radius:99px;background:#fff;border:2px solid var(--line);overflow:hidden;margin-top:10px}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ff9f1c);transition:width .5s}
  .prog-fill.ok{background:linear-gradient(90deg,var(--acc),#04b589)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .tile{background:#fff;border-radius:14px;padding:8px 4px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .tile .ti{font-size:20px} .tile .tl{font-size:11px;color:var(--muted,#777);font-weight:700} .tile .tv{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:var(--acc-ink)}
  .buy-head{display:flex;justify-content:space-between;align-items:center}
  .chip-precio{background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:3px 12px;font-weight:800;font-size:13px}
  .chips-qty{display:flex;gap:8px;margin:10px 0}
  .chips-qty .chipq{flex:1;padding:8px 0;border-radius:12px} .chips-qty .chipq.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  .buy-total{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
  .buy-total b{font-family:'Baloo 2',sans-serif;font-size:24px;color:var(--acc-ink)}
</style>

// CELEBRACIÓN DE PREMIO: confeti + sonido + vibración
// ============================================================
function lanzarConfeti(){
  const colores = ['#FF6B9D','#FFC43D','#06D6A0','#3A86FF','#8E5EFF','#F15BB5','#FF9F1C'];
  for (let i=0;i<70;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random()*7;
    c.style.width = size+'px'; c.style.height = size+'px';
    c.style.left = (Math.random()*100)+'vw';
    c.style.background = colores[Math.floor(Math.random()*colores.length)];
    c.style.borderRadius = Math.random()<0.5 ? '50%' : '2px';
    c.style.animationDuration = (2 + Math.random()*2)+'s';
    c.style.animationDelay = (Math.random()*0.4)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4800);
  }
}

function sonarGanaste(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const notas = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6 — fanfarria corta
    notas.forEach((freq,i)=>{
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      const t = ctx.currentTime + i*0.13;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
      osc.start(t); osc.stop(t+0.3);
    });
  } catch(e){ /* audio no disponible en este navegador */ }
}


// Nombres típicos de voces femeninas en español que ofrecen los sistemas operativos
// (Android, iOS, Windows). Sirve para ordenarlas primero; el usuario igual puede
// elegir cualquier otra desde el selector.
const VOCES_FEMENINAS = ['mujer','female','mónica','monica','paulina','helena','sabina','laura','esperanza',
  'marisol','angélica','angelica','lucía','lucia','conchita','camila','soledad','elvira','francisca','catalina','isabela','maría','maria'];
function vozEsFemenina(v){ const n=(v.name||'').toLowerCase(); return VOCES_FEMENINAS.some(f=>n.includes(f)); }
function vocesEspanol(){
  try { return (window.speechSynthesis.getVoices()||[]).filter(v => /^es/i.test(v.lang)); } catch(e){ return []; }
}
function vozGuardada(){ try { return localStorage.getItem('bf_voz') || ''; } catch(e){ return ''; } }
function guardarVoz(nombre){ try { localStorage.setItem('bf_voz', nombre||''); } catch(e){} }
function vozElegida(){
  const voces = vocesEspanol(); if (!voces.length) return null;
  const guardada = vozGuardada();
  return voces.find(v => v.name === guardada) || voces.find(vozEsFemenina) || voces[0];
}
function cantarBolaConVoz(numero){
  try{
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('Bola ' + numero);
    const v = vozElegida();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-EC'; }
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// Construye el <select> de voces. Se llama de nuevo si las voces cargan tarde (pasa en Chrome/Android).
function pintarSelectorVoz(sel){
  const voces = vocesEspanol();
  if (!voces.length){ sel.innerHTML = '<option>Cargando voces…</option>'; return; }
  const actual = vozElegida();
  sel.innerHTML = voces.map(v => `<option value="${esc(v.name)}" ${actual && v.name===actual.name?'selected':''}>${esc(v.name)}${vozEsFemenina(v)?' 👩':''} (${esc(v.lang)})</option>`).join('');
}
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {
  document.querySelectorAll('.sel-voz').forEach(pintarSelectorVoz);
};

function vibrar(patron){
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(patron); } catch(e){}
}

}

// Muestra el modal de "¡GANASTE!" con uno o varios premios.
// premios: [{ tipo:'linea'|'esquinas'|'tabla_llena'|texto libre, monto:number }]
function mostrarCelebracion(premios){
  if (!premios || !premios.length) return;
  // Candado: evitar que el mismo premio dispare confeti dos veces en pocos segundos
  const clave = premios.map(p => String(p.tipo)+':'+String(p.monto)).join('|');
  const ahora = Date.now();
  if (state._ultimaCelebracionClave === clave && (ahora - (state._ultimaCelebracionTs||0)) < 8000) return;
  state._ultimaCelebracionClave = clave;
  state._ultimaCelebracionTs = ahora;
  lanzarConfeti(); sonarGanaste(); vibrarGanaste();
  const nombreTipo = (t) => {
    const s = String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if (s.includes('linea')) return 'Línea 🎯';
    if (s.includes('esquina')) return '4 Esquinas 🔲';
    if (s.includes('tabla') || s.includes('llena')) return 'Tabla Llena 🀄';
    return t || 'Premio';
  };
  const total = premios.reduce((s,p)=>s+Number(p.monto||0),0);
  const filas = premios.map(p=>`<div class="celebrate-prize">${nombreTipo(p.tipo)} — ${money(p.monto)}</div>`).join('');
  const ov = el(`<div class="celebrate-overlay">
    <div class="celebrate-box">
      <h1>🎉 ¡GANASTE! 🎉</h1>
      ${filas}
      <div class="celebrate-amount">Total: ${money(total)}</div>
      <button class="btn-acc" id="cel_close">¡Genial! 🙌</button>
    </div></div>`);
  document.body.appendChild(ov);
  ov.querySelector('#cel_close').onclick = () => ov.remove();
  setTimeout(()=>{ if (document.body.contains(ov)) ov.remove(); }, 8000);
}

// Detecta si una fila de "transactions" nueva corresponde a un premio ganado
// (y no a una recarga, retiro o compra de cartones).
// Nota: en vez de exigir que el texto contenga una palabra clave de premio
// (frágil: depende de adivinar el texto exacto que use la base de datos),
// se celebra CUALQUIER transacción positiva que no sea claramente una recarga,
// retiro o compra. Así, aunque el texto exacto cambie del lado del servidor,
// la celebración sigue funcionando.
// El tipo de una transacción de premio es siempre 'premio'; el detalle (Línea /
// 4 Esquinas / Tabla Llena) viene en la descripción: "Premio Línea · nombre de la partida".
function tipoPremioDeTx(t){
  const d = String((t && (t.descripcion || t.tipo)) || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if (d.includes('esquina')) return 'esquinas';
  if (d.includes('tabla') || d.includes('llena')) return 'llena';
  if (d.includes('linea')) return 'linea';
  return 'premio';
}
// Recuerda (en este navegador) qué premio ya se celebró, para no repetir el confeti al recargar.
function premioYaCelebrado(id){ try { return !!id && localStorage.getItem('bf_celebrado_'+state.user.id) === String(id); } catch(e){ return false; } }
function marcarPremioCelebrado(id){ try { if (id) localStorage.setItem('bf_celebrado_'+state.user.id, String(id)); } catch(e){} }
const TIPOS_NO_PREMIO = ['recarga', 'retiro', 'compra', 'reembolso', 'ajuste_admin'];
function esTransaccionPremio(tipo){
  const t = String(tipo||'').toLowerCase();
  if (!t) return true; // sin tipo definido: se asume premio antes que ocultar la celebración
  return !TIPOS_NO_PREMIO.some(k => t.includes(k));
}

// Escucha en tiempo real cualquier transacción nueva del usuario. Si es un
// premio, dispara la celebración; de paso, refresca el saldo en pantalla
// (esto también corrige que el saldo no se actualizaba solo al aprobar recargas).
function setupTransactionRealtime(uid){
  if (state.txChannel) { sb.removeChannel(state.txChannel); state.txChannel = null; }
  state.txChannel = sb.channel('tx_'+uid)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'transactions', filter:`user_id=eq.${uid}` }, (payload) => {
      const t = payload.new;
      if (t && esTransaccionPremio(t.tipo) && Number(t.monto) > 0){
        marcarPremioCelebrado(t.id);
        mostrarCelebracion([{ tipo:tipoPremioDeTx(t), monto:t.monto }]);
      }
      sb.from('profiles').select('saldo').eq('id', uid).single().then(({data:p})=>{
        if (p && state.profile){
          state.profile.saldo = p.saldo;
          // Actualizar solo el saldo en pantalla si existe, sin redibujar todo (evita doble confeti / saltos)
          const elSaldo = document.querySelector('.topbar .saldo');
          if (elSaldo) elSaldo.textContent = money(p.saldo);
          else if (state.user) render();
        }
      });
    }).subscribe();
}

async function login(btn){
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn._txt = btn.textContent; btn.innerHTML = '<span class="spinner"></span> Entrando…'; }
  const cel = $('#a_cel').value.trim(), pass = $('#a_pass').value;
  if (!/^\d{10}$/.test(cel)) { state.err='El celular debe tener 10 dígitos'; if (btn){btn.disabled=false; btn.textContent=btn._txt;} return render(); }
  const { data, error } = await sb.auth.signInWithPassword({ email: cel+'@bingo.family', password: pass });
  if (error) { state.err = 'Celular o contraseña incorrectos'; if (btn){btn.disabled=false; btn.textContent=btn._txt;} return render(); }
  await afterLogin(data.user);
}

async function registro(btn){
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn._txt = btn.textContent; btn.innerHTML = '<span class="spinner"></span> Creando…'; }
  const reenable = () => { if (btn){ btn.disabled=false; btn.textContent=btn._txt; } };
  const nombre=$('#r_nom').value.trim().toUpperCase(), apellido=$('#r_ape').value.trim().toUpperCase(), cedula=$('#r_ced').value.trim(),
        celular=$('#r_cel').value.trim(), fecha_nacimiento=$('#r_fnac').value, pass=$('#r_pass').value,
        invite_code=$('#r_code').value.trim().toUpperCase();
  if (!nombre || !apellido) { state.err='Falta nombre o apellido'; reenable(); return render(); }
  if (!/^\d{10}$/.test(cedula)) { state.err='Cédula inválida (10 dígitos)'; reenable(); return render(); }
  if (!/^\d{10}$/.test(celular)) { state.err='Celular inválido (10 dígitos)'; reenable(); return render(); }
  if (!fecha_nacimiento) { state.err='Falta la fecha de nacimiento'; reenable(); return render(); }
  { const eClave = validarClaveNueva(pass, pass, celular); if (eClave) { state.err = eClave; reenable(); return render(); } }
  if (!invite_code) { state.err='Falta el código de invitación'; reenable(); return render(); }
  const { data, error } = await sb.auth.signUp({
    email: celular+'@bingo.family', password: pass,
    options: { data: { nombre, apellido, cedula, celular, fecha_nacimiento, invite_code } }
  });
  if (error) { state.err = error.message.includes('already registered') ? 'Ese celular ya tiene cuenta' : error.message; reenable(); return render(); }
  if (!data.session) { state.err='No se pudo crear la sesión. Intenta iniciar sesión.'; state._authModo='login'; reenable(); return render(); }
  await afterLogin(data.user);
}

// Si ganaste un premio mientras no tenías la app abierta (los últimos 10
// minutos), igual te muestra la celebración al volver a entrar.
async function revisarPremiosRecientesNoVistos(uid){
  try {
    const desde = new Date(Date.now() - 10*60*1000).toISOString();
    const { data: txs } = await sb.from('transactions').select('*')
      .eq('user_id', uid).gt('created_at', desde).order('created_at', {ascending:false});
    const premio = (txs||[]).find(t => esTransaccionPremio(t.tipo) && Number(t.monto) > 0);
    if (premio && !premioYaCelebrado(premio.id)){
      marcarPremioCelebrado(premio.id);
      mostrarCelebracion([{ tipo: tipoPremioDeTx(premio), monto: premio.monto }]);
    }
  } catch(e){ /* si falla esta revisión extra, no pasa nada grave */ }
}

const jugamos = { ch:null, conectados:0, vistos:new Set(), timer:null };
function jugamosBarra(html, gid){
  let b = document.getElementById('jugamos-bar'); if (b) b.remove();
  b = document.createElement('div'); b.id = 'jugamos-bar';
  b.innerHTML = `<span>${html}</span><span style="display:flex;gap:6px">${gid ? '<button id="jb_ir">Ir a la sala</button>' : ''}<button id="jb_x">✕</button></span>`;
  document.body.appendChild(b);
  const cerrar = () => { b.remove(); if (jugamos.timer){ clearTimeout(jugamos.timer); jugamos.timer = null; } };
  b.querySelector('#jb_x').onclick = cerrar;
  const ir = b.querySelector('#jb_ir');
  if (ir) ir.onclick = () => { cerrar(); state.activeGameId = gid; setView('juego'); };
  if (jugamos.timer) clearTimeout(jugamos.timer);
  jugamos.timer = setTimeout(cerrar, 60000);
  vibrar([120,60,120]);
}
function actualizarJugamosN(){ document.querySelectorAll('.jug-n').forEach(s => s.textContent = jugamos.conectados); }
function iniciarJugamos(){
  if (jugamos.ch || !state.user) return;
  jugamos.ch = sb.channel('lobby_jugamos', { config:{ broadcast:{ self:false }, presence:{ key: state.user.id } } })
    .on('presence', { event:'sync' }, () => { jugamos.conectados = Object.keys(jugamos.ch.presenceState()).length; actualizarJugamosN(); })
    .on('broadcast', { event:'jugamos' }, (p) => {
      const d = p.payload || {};
      if (state.view === 'juego' && state.activeGameId === d.game_id) return;
      jugamosBarra(`📣 <b>${esc(d.nombre)}</b> quiere jugar en <b>${esc(d.sala)}</b>. Faltan ${Number(d.faltan)||0} cartones. ¿Jugamos?`, d.game_id);
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'games' }, (p) => avisoInicioAnticipado(p.new))
    .subscribe(async (st) => { if (st === 'SUBSCRIBED') { try { await jugamos.ch.track({ t: Date.now() }); } catch(e){} } });
}
function detenerJugamos(){
  if (jugamos.ch){ sb.removeChannel(jugamos.ch); jugamos.ch = null; }
  const b = document.getElementById('jugamos-bar'); if (b) b.remove();
  jugamos.conectados = 0;
}
function avisoInicioAnticipado(g){
  if (!g || g.estado !== 'programada' || jugamos.vistos.has(g.id)) return;
  const falta = new Date(g.inicio_programado).getTime() - Date.now();
  if ((g.cartones_vendidos||0) < g.min_cartones || falta <= 0 || falta > 60000) return;
  jugamos.vistos.add(g.id);
  if (state.view === 'juego' && state.activeGameId === g.id) return;
  jugamosBarra(`🚀 <b>Partida iniciada por los jugadores</b> · ${esc(g.nombre||'Sala')} · empieza en menos de 1 minuto`, g.id);
}
function enviarJugamos(g, btn){
  if (!jugamos.ch || jugamos.conectados < 2) return jugamosBarra('ℹ️ Ahora mismo eres el único conectado.');
  let ult = 0; try { ult = Number(localStorage.getItem('bf_jugamos_ult')||0); } catch(e){}
  const espera = 10*60*1000 - (Date.now() - ult);
  if (espera > 0) return jugamosBarra('⏳ Ya enviaste un aviso hace poco. Puedes volver a enviarlo en ' + Math.ceil(espera/60000) + ' min.');
  jugamos.ch.send({ type:'broadcast', event:'jugamos', payload:{ game_id:g.id, sala:g.nombre||g.rooms?.nombre||'Sala', nombre:state.profile.nombre, faltan:Math.max(0,(g.min_cartones||0)-(g.cartones_vendidos||0)) } });
  try { localStorage.setItem('bf_jugamos_ult', String(Date.now())); } catch(e){}
  btn.disabled = true; btn.textContent = '✅ Aviso enviado';
}

function pintarHeroSala(root, s){
  const minC = Number(s.min_cartones||0), maxC = Number(s.max_cartones||0), v = Number(s.cartones_vendidos||0);
  const ok = minC > 0 && v >= minC, pct = minC > 0 ? Math.min(100, Math.round(v / minC * 100)) : 100;
  const q = (id) => root.querySelector(id);
  q('#sala_fill').style.width = pct + '%'; q('#sala_fill').classList.toggle('ok', ok);
  q('#sala_txt').innerHTML = ok ? `🚀 <b>¡Mínimo alcanzado!</b> La partida arranca en cualquier momento · ${v} / ${maxC} cartones`
                                : `<b>${v}</b> de <b>${minC}</b> cartones para arrancar · faltan <b>${Math.max(0, minC - v)}</b>`;
  q('#sala_pl').textContent = money(s.pozo_linea); q('#sala_pe').textContent = money(s.pozo_esquinas); q('#sala_pll').textContent = money(s.pozo_llena);
  const rec = Number(s.recaudado || 0), casa = Math.max(0, Math.round((rec - Number(s.pozo_linea||0) - Number(s.pozo_esquinas||0) - Number(s.pozo_llena||0)) * 100) / 100);
  q('#sala_rec').innerHTML = `💰 Recaudado: <b>${money(rec)}</b> (${v} × ${money(s.precio_carton)}) · Casa ${money(casa)} · el pozo crece con cada cartón`;
  if (ok) { const j = q('#sala_jug'); if (j) j.innerHTML = ''; }
  root.dataset.inicio = s.inicio_programado;
}
async function refrescarHeroSala(gid){
  const root = document.getElementById('sala_hero'); if (!root) return;
  const { data: s } = await sb.from('games').select('cartones_vendidos,min_cartones,max_cartones,recaudado,precio_carton,pozo_linea,pozo_esquinas,pozo_llena,inicio_programado').eq('id', gid).single();
  if (s && document.getElementById('sala_hero') === root) pintarHeroSala(root, s);
}

      <div class="small" id="sala_txt" style="margin-top:4px"></div>
      <div class="tiles">
        <div class="tile"><div class="ti">📏</div><div class="tl">Línea</div><div class="tv" id="sala_pl">${money(pLinea)}</div></div>
        <div class="tile"><div class="ti">🔲</div><div class="tl">4 Esquinas</div><div class="tv" id="sala_pe">${money(pEsq)}</div></div>
        <div class="tile"><div class="ti">🏆</div><div class="tl">Tabla llena</div><div class="tv" id="sala_pll">${money(pLlena)}</div></div>
      </div>
      <div class="small muted" id="sala_rec" style="margin-top:8px"></div>

        tbl.appendChild(elTr(`<tr><td>${t}${w.es_empate?' (empate)':''}</td><td>${esc(w.nombre)}</td><td>${money(w.monto)}</td></tr>`));

      wbox.appendChild(tbl);
      wrap.appendChild(wbox);

      // Respaldo: si la celebración no se disparó ya vía el canal de
      // transacciones (por ejemplo si el usuario no estaba conectado al
      // momento del pago), se muestra aquí al abrir los resultados.
      if (!state._celebrado) state._celebrado = new Set();
      if (!state._celebrado.has(gid)){
        state._celebrado.add(gid);
        const miNombre = `${state.profile.nombre} ${state.profile.apellido}`.trim().toLowerCase();
        const misPremios = (winners||[]).filter(w => (w.user_id && w.user_id === state.user.id) ||
          (!w.user_id && (w.nombre||'').trim().toLowerCase() === miNombre));
        if (misPremios.length) setTimeout(()=>mostrarCelebracion(misPremios), 300);
      }
    }
  }

  // --- Empate activo ---
  if (g.estado === 'empate'){
    const { data: ties } = await sb.from('game_ties').select('*').eq('game_id', gid)
      .in('estado', ['voto','sobres']).order('created_at',{ascending:false}).limit(1);
    if (ties && ties[0]) wrap.appendChild(renderTie(ties[0]));
  }

  // --- Mis cartones (vista simple: no aplica mientras está en_vivo, ya se mostró arriba) ---
  if (g.estado !== 'en_vivo'){
    const { data: gp } = await sb.from('game_players').select('*').eq('game_id', gid).eq('user_id', state.user.id).maybeSingle();
    if (gp && gp.cartones && gp.cartones.length){
      const drawn = g.bolas_sacadas || [];
      const cbox = el(`<div class="card"><div class="row between" style="align-items:center;margin-bottom:8px"><h3 style="margin:0">Mis cartones (${gp.cartones.length})</h3><span class="row" style="gap:6px"><button class="btn-ghost btn-sm" id="mc_toggle"></button><button class="btn-ghost btn-sm" id="mc_zoom">🔍 Agrandar</button></span></div></div>`);
      const cgrid = el('<div class="cartones-grid"></div>');
      gp.cartones.forEach((c,i) => {
        const ce = renderCarton(c, drawn);
        ce.appendChild(el(`<div class="small muted" style="text-align:center;margin-top:3px">Cartón ${i+1}</div>`));
        cgrid.appendChild(ce);
      });
      let grande = false;
      const aplicarZoom = () => {
        cgrid.style.setProperty('--n-scale', grande ? 1 : 0.85);
        cgrid.style.gridTemplateColumns = grande ? '1fr' : 'repeat(auto-fill, minmax(150px, 1fr))';
        $('#mc_zoom', cbox).textContent = grande ? '🔍 Reducir' : '🔍 Agrandar';
      };
      $('#mc_zoom', cbox).onclick = () => { grande = !grande; aplicarZoom(); };
      let visible = gp.cartones.length <= 4;
      const aplicarVis = () => { cgrid.style.display = visible ? '' : 'none'; $('#mc_zoom', cbox).style.display = visible ? '' : 'none'; $('#mc_toggle', cbox).textContent = visible ? 'Ocultar' : 'Mostrar'; };
      $('#mc_toggle', cbox).onclick = () => { visible = !visible; aplicarVis(); };
      cbox.appendChild(cgrid); aplicarZoom(); aplicarVis();
      wrap.appendChild(cbox);
    }
  }

  setupRealtime(gid);
  return wrap;
}

// Analiza un cartón y determina qué tan cerca está de cada premio.
// "Línea" en este juego se gana con horizontal, vertical O diagonal (la
// primera que se complete, según _carton_cumple del lado de Supabase), así
// que el indicador de "ya casi" revisa las 4 variantes, no solo horizontal.
function analizarCarton(cols, drawn){
  const marcada = (c,f) => drawn.includes(cols[c][f]);
  let totalMarcadas = 0;
  for (let c=0;c<5;c++) for (let f=0;f<5;f++) if (marcada(c,f)) totalMarcadas++;
  const faltanTablaLlena = 25 - totalMarcadas;

  // Horizontales: fila f fija, recorre columnas
  const lineasCasi = [];
  for (let f=0; f<5; f++){
    let faltan = 0;
    for (let c=0; c<5; c++) if (!marcada(c,f)) faltan++;
    if (faltan === 1) lineasCasi.push(f);
  }

  // Verticales: columna c fija, recorre filas
  const columnasCasi = [];
  for (let c=0; c<5; c++){
    let faltan = 0;
    for (let f=0; f<5; f++) if (!marcada(c,f)) faltan++;
    if (faltan === 1) columnasCasi.push(c);
  }

  // Diagonales (\ y /)
  let faltanD1 = 0, faltanD2 = 0;
  for (let a=0; a<5; a++){
    if (!marcada(a,a)) faltanD1++;    // diagonal principal \
    if (!marcada(a,4-a)) faltanD2++;  // diagonal secundaria /
  }
  const diagonalCasi = { principal: faltanD1===1, secundaria: faltanD2===1 };

  const esquinas = [[0,0],[4,0],[0,4],[4,4]]; // [columna, fila]
  const esquinasFaltan = esquinas.filter(([c,f]) => !marcada(c,f)).length;
  const esquinasCasi = esquinasFaltan === 1;

  return { faltanTablaLlena, lineasCasi, columnasCasi, diagonalCasi, esquinasCasi };
}

// Aplica/renueva las señales de "ya casi" (badge de tabla llena, parpadeo de
// línea o de 4 esquinas) sobre un cartón ya renderizado en el DOM.
function aplicarIndicadores(cartonEl, cols, drawn, premiosGanados){
  premiosGanados = premiosGanados || new Set();
  const info = analizarCarton(cols, drawn);

  cartonEl.querySelectorAll('.cnum').forEach(c => c.classList.remove('blink-line','blink-corner'));

  if (!premiosGanados.has('linea')){
    info.lineasCasi.forEach(f=>{ // horizontal: toda la fila f
      cartonEl.querySelectorAll(`.cnum[data-f="${f}"]`).forEach(c=>c.classList.add('blink-line'));
    });
    info.columnasCasi.forEach(c=>{ // vertical: toda la columna c
      cartonEl.querySelectorAll(`.cnum[data-c="${c}"]`).forEach(el2=>el2.classList.add('blink-line'));
    });
    if (info.diagonalCasi.principal){ // diagonal \
      for (let a=0;a<5;a++){
        const cell = cartonEl.querySelector(`.cnum[data-c="${a}"][data-f="${a}"]`);
        if (cell) cell.classList.add('blink-line');
      }
    }
    if (info.diagonalCasi.secundaria){ // diagonal /
      for (let a=0;a<5;a++){
        const cell = cartonEl.querySelector(`.cnum[data-c="${a}"][data-f="${4-a}"]`);
        if (cell) cell.classList.add('blink-line');
      }
    }
  }
  if (info.esquinasCasi && !premiosGanados.has('esquinas')){
    [[0,0],[4,0],[0,4],[4,4]].forEach(([c,f])=>{
      const cell = cartonEl.querySelector(`.cnum[data-c="${c}"][data-f="${f}"]`);
      if (cell) cell.classList.add('blink-corner');
    });
  }
  const badge = cartonEl.querySelector('.carton-badge');
  if (badge){
    const casi = info.faltanTablaLlena > 0 && info.faltanTablaLlena <= 2 && !premiosGanados.has('tabla_llena');
    badge.classList.toggle('hide', !casi);
  }
}

// ---- Cartón ganador: qué premios ganó cada cartón mío ----
// Réplica en el navegador de _carton_cumple (Supabase): línea = fila, columna o diagonal.
function cartonCumpleTipo(cols, marcadas, tipo){
  const m = (c,f) => marcadas.has(cols[c][f]);
  if (tipo === 'esquinas') return m(0,0) && m(4,0) && m(0,4) && m(4,4);
  if (tipo === 'llena'){ for (let c=0;c<5;c++) for (let f=0;f<5;f++) if (!m(c,f)) return false; return true; }
  if (tipo === 'linea'){
    let d1 = true, d2 = true;
    for (let a=0;a<5;a++){
      let fila = true, col = true;
      for (let b=0;b<5;b++){ if (!m(b,a)) fila = false; if (!m(a,b)) col = false; }
      if (fila || col) return true;
      if (!m(a,a)) d1 = false;
      if (!m(a,4-a)) d2 = false;
    }
    return d1 || d2;
  }
  return false;
}
// Posición de la bola con la que el cartón completó ese premio (-1 si aún no).
function bolaDeCompletado(cols, drawn, tipo){
  const s = new Set();
  for (let k=0;k<drawn.length;k++){ s.add(drawn[k]); if (cartonCumpleTipo(cols, s, tipo)) return k; }
  return -1;
}
// Los premios que gané en esta partida se saben EXACTO por mis transacciones (no por nombres).
// Entre mis cartones, el ganador es el que completó primero ese premio.
async function calcularCartonesGanadores(gid, misCartones, drawn){
  const res = misCartones.map(() => new Set());
  try {
    const { data: txp } = await sb.from('transactions').select('tipo,descripcion')
      .eq('user_id', state.user.id).eq('referencia_id', gid).eq('tipo', 'premio');
    const tipos = new Set((txp||[]).map(t => tipoPremioDeTx(t)).filter(t => t !== 'premio'));
    tipos.forEach(tipo => {
      const idxs = misCartones.map(cols => bolaDeCompletado(cols, drawn, tipo));
      const validos = idxs.filter(k => k >= 0);
      if (!validos.length) return;
      const min = Math.min(...validos);
      idxs.forEach((k,i) => { if (k === min) res[i].add(tipo); });
    });
  } catch(e){}
  return res;
}

function renderCarton(cols, drawn, opts={}){
  const box = el(`<div class="carton"></div>`);
  // Colores si este cartón (o el jugador) ya ganó línea / esquinas / tabla
  const pg = opts.premiosGanados || new Set();
  const tiposCarton = opts.tiposDeEsteCarton || new Set(); // si el servidor envía por cartón
  if (tiposCarton.has('linea') || (opts.marcarTodosGanados && pg.has('linea'))) box.classList.add('ganador-linea');
  if (tiposCarton.has('esquinas') || (opts.marcarTodosGanados && pg.has('esquinas'))) box.classList.add('ganador-esquinas');
  if (tiposCarton.has('llena') || tiposCarton.has('tabla_llena') || tiposCarton.has('tabla') || (opts.marcarTodosGanados && (pg.has('tabla_llena')||pg.has('tabla')))) box.classList.add('ganador-tabla');
  box.appendChild(el(`<div class="carton-badge hide">¡Ya casi! 🀄</div>`));
  const grid = el(`<div class="cgrid"></div>`);
  COLS.forEach(l => grid.appendChild(el(`<div class="chead">${l}</div>`)));
  for (let f=0; f<5; f++){
    for (let c=0; c<5; c++){
      const n = cols[c][f];
      const marked = drawn.includes(n);
      grid.appendChild(el(`<div class="cnum ${marked?'marked':''}" data-num="${n}" data-c="${c}" data-f="${f}">${n}</div>`));
    }
  }
  box.appendChild(grid);
  aplicarIndicadores(box, cols, drawn, opts.premiosGanados);
  return box;
}

function renderTie(tie){
  const box = el(`<div class="card"></div>`);
  const tipo = tie.tipo==='linea'?'Línea':tie.tipo==='esquinas'?'4 Esquinas':'Tabla Llena';
  const soyGanador = tie.ganadores.includes(state.user.id);
  box.innerHTML = `<h3>🤝 Empate en ${tipo} — ${money(tie.monto)}</h3>
    <p class="small muted">Ganadores: ${tie.ganadores_info.map(g=>esc(g.nombre)).join(', ')}</p>`;

  if (tie.estado === 'voto'){
    if (soyGanador){
      const yaVote = tie.votos && tie.votos[state.user.id];
      if (yaVote){
        box.appendChild(el(`<p class="ok-box">Ya votaste: <b>${yaVote==='repartir'?'Repartir':'Sobres'}</b>. Esperando a los demás…</p>`));
      } else {
        box.appendChild(el(`<div>
          <p>¿Cómo prefieres resolver el empate?</p>
          <div class="row">
            <button class="btn-acc" id="v_rep" style="flex:1">Repartir en partes iguales</button>
            <button class="btn-warn" id="v_sob" style="flex:1">Jugar a los sobres</button>
          </div></div>`));
        box.querySelector('#v_rep').onclick = () => votar(tie.id,'repartir');
        box.querySelector('#v_sob').onclick = () => votar(tie.id,'sobre');
      }
    } else {
      box.appendChild(el(`<p class="muted">Los ganadores están votando cómo repartir el premio…</p>`));
    }
  } else if (tie.estado === 'sobres'){
    box.appendChild(el(`<p>El número más alto se lleva todo el premio. ${soyGanador?'Elige tu sobre:':'Los ganadores están eligiendo sus sobres…'}</p>`));
    sb.from('tie_envelopes').select('*').eq('tie_id', tie.id).then(({data:envs})=>{
      const n = tie.ganadores.length;
      const wrap2 = el(`<div class="envs"></div>`);
      for (let i=0;i<n;i++){
        const taken = envs && envs.find(e=>e.idx===i && tie.elecciones && tie.elecciones[i]);
        const mine = tie.elecciones && tie.elecciones[i]===state.user.id;
        const e2 = el(`<div class="env ${taken?'taken':''} ${mine?'mine':''}">✉️</div>`);
        if (soyGanador && !taken && !tie.elecciones?.[String(state.user.id)]){
          e2.onclick = () => elegirSobre(tie.id, i);
        }
        wrap2.appendChild(e2);
      }
      box.appendChild(wrap2);
    });
  }
  return box;
}

// --- tiempo real ---
function teardownRealtime(){
  if (state.gameChannel){ sb.removeChannel(state.gameChannel); state.gameChannel=null; }
  if (state.tieChannel){ sb.removeChannel(state.tieChannel); state.tieChannel=null; }
  if (state.chatChannel){ sb.removeChannel(state.chatChannel); state.chatChannel=null; }
  state._liveEstado = null;
}
async function updateJuegoLive(gid){
  // Actualización ligera: solo refresca bolas y marca cartones, sin redibujar
  // toda la pantalla (eso es lo que causaba el parpadeo con cada bola).
  const { data: g } = await sb.from('games').select('estado,bolas_sacadas').eq('id', gid).single();
  if (!g) return;
  if (state._liveEstado && state._liveEstado !== g.estado){
    // La partida cambió de fase (ej: pasó a empate o finalizada) → ahí sí
    // conviene redibujar todo porque cambia el contenido de la pantalla.
    render();
    return;
  }
  state._liveEstado = g.estado;
  if (g.estado === 'programada') { refrescarHeroSala(gid); return; }
  const drawn = g.bolas_sacadas || [];

  // Tablero clásico compacto de bolas (si estamos en la vista en_vivo)
  const board = document.querySelector('#bolas_board');
  if (board){
    renderBolasBoard(board, drawn);
    const h3 = board.parentElement.querySelector('h3');
    if (h3) h3.textContent = `Bolas (${drawn.length})`;
  }
  // Voz: anunciar la última bola si es nueva
  const ultimaBola = drawn.length ? drawn[drawn.length-1] : null;
  if (ultimaBola != null && ultimaBola !== state._ultimaBolaCantada){
    state._ultimaBolaCantada = ultimaBola;
    cantarBolaConVoz(ultimaBola);
  }
  // Actualizar número grande en móvil
  const bolaMovil = document.querySelector('#bola_actual_movil');
  if (bolaMovil && ultimaBola != null){
    bolaMovil.innerHTML = '🎱 ' + ultimaBola + '<div class="sub">Bola ' + drawn.length + ' de 75</div>';
  }
  // Fila simple (vista empate/finalizada, si estuviera presente)
  const ballsRow = document.querySelector('#balls_row');
  if (ballsRow){
    const h3 = ballsRow.parentElement.querySelector('h3');
    if (h3) h3.textContent = `Bolas cantadas (${drawn.length})`;
    renderBalls(ballsRow, drawn);
  }

  // Refrescar qué premios ya se otorgaron, para saber cuándo dejar de
  // parpadear (si el RPC no admite consultarse en vivo, se ignora en silencio).
  let premiosGanados = state._premiosGanadosCache || new Set();
  if (g.estado === 'en_vivo'){
    try {
      const { data: winners } = await sb.rpc('ganadores_partida', { p_game: gid });
      premiosGanados = new Set((winners||[]).map(w=>w.tipo));
      state._premiosGanadosCache = premiosGanados;
    } catch(e){ /* seguimos sin esa info */ }
  }

  // Si se pagó un premio nuevo, recalcular qué cartón mío lo ganó (para pintarlo)
  if (g.estado === 'en_vivo' && premiosGanados.size !== state._nPremiosCartones){
    state._nPremiosCartones = premiosGanados.size;
    state._tiposPorCarton = await calcularCartonesGanadores(gid, state._misCartonesData || [], drawn);
  }

  // Marcar números nuevos y recalcular indicadores de "ya casi" por cartón
  const misCartones = state._misCartonesData || [];
  document.querySelectorAll('#cartones_grid .carton').forEach(cartonEl => {
    const idx = Number(cartonEl.dataset.idx);
    const cols = misCartones[idx];
    if (!cols) return;
    cartonEl.querySelectorAll('.cnum').forEach(cell => {
      const n = Number(cell.dataset.num);
      if (drawn.includes(n)) cell.classList.add('marked');
    });
    const tiposC = (state._tiposPorCarton || [])[idx] || new Set();
    cartonEl.classList.toggle('ganador-linea', tiposC.has('linea'));
    cartonEl.classList.toggle('ganador-esquinas', tiposC.has('esquinas'));
    cartonEl.classList.toggle('ganador-tabla', tiposC.has('llena'));
    aplicarIndicadores(cartonEl, cols, drawn, premiosGanados);
  });
  // Cartones fuera del layout en vivo (vistas simples): solo marcar números
  document.querySelectorAll('.carton:not(#cartones_grid .carton) .cnum').forEach(cell => {
    const n = Number(cell.dataset.num || cell.textContent);
    if (drawn.includes(n)) cell.classList.add('marked');
  });
}
function setupRealtime(gid){
  teardownRealtime();
  state.gameChannel = sb.channel('game_'+gid)
    .on('postgres_changes', { event:'*', schema:'public', table:'games', filter:`id=eq.${gid}` }, () => {
      if (state.view==='juego' && state.activeGameId===gid) updateJuegoLive(gid);
    }).subscribe();
  state.tieChannel = sb.channel('ties_'+gid)
    .on('postgres_changes', { event:'*', schema:'public', table:'game_ties', filter:`game_id=eq.${gid}` }, () => {
      if (state.view==='juego' && state.activeGameId===gid) render();
    }).subscribe();
  setupChatRealtime(gid);
}

// Valida un monto escrito por el usuario. Devuelve {valor} o {error}.
function parseMonto(texto, {min, max}){
  let limpio = String(texto||'').trim().replace(',', '.');
  limpio = limpio.replace(/^\./, '0.').replace(/\.$/, '');   // ".5" -> "0.5" · "5." -> "5"
  if (!/^\d+(\.\d{1,2})?$/.test(limpio)) return { error: 'Escribe un monto válido, solo números. Ej: 20 o 20.50' };
  const n = Number(limpio);
  if (n <= 0) return { error: 'El monto debe ser mayor a $0' };
  if (n < min) return { error: `El monto mínimo es ${money(min)}` };
  if (n > max) return { error: `El monto máximo es ${money(max)}` };
  return { valor: Math.round(n*100)/100 };
}
function errPanel(p, msg){
  const b = p.querySelector('.p-err'); if (!b) return;
  b.textContent = '⚠️ ' + msg; b.style.display = 'block';
  try { b.scrollIntoView({block:'nearest'}); } catch(e){}
}
function busy(btn, txt){ btn.disabled = true; btn._t = btn.textContent; btn.innerHTML = `<span class="spinner"></span> ${txt}`; }
function unbusy(btn){ btn.disabled = false; if (btn._t) btn.textContent = btn._t; }

    if (!confirm('¿Cancelar tu solicitud de recarga?')) return;
    busy(bc, 'Cancelando…');
    const { error } = await sb.rpc('cancelar_mi_recarga', { p_id: pendRec.id });
    if (error) state.err = error.message; else state.msg = 'Recarga cancelada.';

  };
  wrap.appendChild(top);

  // --- Panel: recargar ---

      ${bloqueDemo()}
      ${MODO_DEMO ? `<div class="demo-box">🧪 <b>Recarga de prueba.</b> En modo prueba <b>no se reciben depósitos</b>: no transfieras dinero real. Puedes enviar la solicitud para practicar y se acreditará como <b>saldo de prueba</b>, sin valor real.</div>
      <p class="small"><b>1.</b> Escribe un monto de prueba y cualquier número como comprobante (por ejemplo 123).</p>` : `<p class="small"><b>1.</b> Transfiere a una de estas cuentas (escanea el QR o usa los datos):</p>
      <div class="qr-row">${cuentasCobroHtml()}</div>
      <p class="small"><b>2.</b> Escribe cuánto transferiste y el número de comprobante. Pon tu celular <b>${esc(pf.celular)}</b> como concepto de la transferencia.</p>`}

      <input id="rc_monto" placeholder="Monto (USD ${RECARGA_MIN} a ${RECARGA_MAX})" inputmode="decimal">

      <div class="row"><button class="btn-acc" id="rc_go" style="flex:1">Enviar solicitud</button><button class="btn-ghost" id="rc_x">Cerrar</button></div>
    </div>`);

    p.querySelector('#rc_go').onclick = async (ev) => {

      if (m.error) return errPanel(p, m.error);
      const comp = p.querySelector('#rc_comp').value.trim();
      if (comp.length < 3 || /[<>"&]/.test(comp)) return errPanel(p, 'Escribe el número de comprobante (mínimo 3 caracteres, sin < > " &).');
      busy(ev.target, 'Enviando…');
      const { error } = await sb.rpc('solicitar_recarga', { p_monto: m.valor, p_nota: comp });
      if (error) { unbusy(ev.target); return errPanel(p, error.message); }

  // --- Panel: retirar ---
  if (state.saldoPanel === 'retiro' && !hayPend){
    const hayEnRevision = ctas.some(cu => cu.estado === 'pendiente');
    const p = el(`<div class="card">
      <h3>Retirar saldo</h3>
      ${MODO_DEMO ? '<div class="demo-box">🧪 <b>Retiro de prueba.</b> Es saldo de prueba: no se paga dinero real.</div>' : ''}
      <p class="small">Mínimo ${money(RETIRO_MIN)} · máximo ${money(RETIRO_MAX_24H)} cada 24 horas. El monto queda retenido hasta que el administrador haga el depósito a tu cuenta.</p>
      <div class="p-err err-box" style="display:none"></div>
      ${verificadas.length ? `
        <select id="rt_cta">${verificadas.map(cu => `<option value="${cu.id}">${BANCO_TXT[cu.banco]||esc(cu.banco)} · ${esc(cu.tipo)} · ${esc(cu.numero)}</option>`).join('')}</select>
        <input id="rt_monto" placeholder="Monto a retirar" inputmode="decimal">
        <input id="rt_pass" type="password" placeholder="Confirma tu contraseña">
        <p class="small muted">Por tu seguridad, para retirar hay que confirmar tu contraseña — así nadie más puede pedir un retiro desde tu celular sin saberla.</p>
        <div class="row"><button class="btn-acc" id="rt_go" style="flex:1">Solicitar retiro</button><button class="btn-ghost" id="rt_x">Cerrar</button></div>`
      : `<p class="small">Para retirar necesitas al menos una cuenta <b>verificada</b>. ${hayEnRevision ? 'Tu cuenta está en revisión: el administrador la verificará pronto.' : 'Registra tu cuenta en "Mis cuentas", más abajo.'}</p>
         <button class="btn-ghost" id="rt_x">Cerrar</button>`}
    </div>`);
    p.querySelector('#rt_x').onclick = () => { state.saldoPanel = null; render(); };
    const go = p.querySelector('#rt_go');
    if (go) go.onclick = async (ev) => {
      const m = parseMonto(p.querySelector('#rt_monto').value, {min:RETIRO_MIN, max:RETIRO_MAX_24H});
      if (m.error) return errPanel(p, m.error);
      if (m.valor > Number(pf.saldo)) return errPanel(p, 'Saldo insuficiente.');
      const pass = p.querySelector('#rt_pass').value;
      if (!pass) return errPanel(p, 'Confirma tu contraseña para continuar.');
      busy(ev.target, 'Verificando…');
      const { error: eAuth } = await sb.auth.signInWithPassword({ email: pf.celular+'@bingo.family', password: pass });
      if (eAuth) { unbusy(ev.target); return errPanel(p, 'Contraseña incorrecta.'); }
      busy(ev.target, 'Enviando…');
      const ctaSel = p.querySelector('#rt_cta').value;
      const { error } = await sb.rpc('solicitar_retiro', { p_monto: m.valor, p_cuenta: ctaSel });
      if (error) { unbusy(ev.target); return errPanel(p, error.message); }
      const { data: pr } = await sb.from('profiles').select('saldo').eq('id', uid).single();
      if (pr) state.profile.saldo = pr.saldo;
      const ctaTxt = ctas.find(c => c.id === ctaSel);
      const msjAdmin = `🔔 Nueva solicitud de RETIRO\nJugador: ${pf.nombre} ${pf.apellido}\nCédula: ${pf.cedula}\nCelular: ${pf.celular}\nMonto: ${money(m.valor)}\nCuenta: ${ctaTxt ? (BANCO_TXT[ctaTxt.banco]||ctaTxt.banco)+' · '+ctaTxt.tipo+' · '+ctaTxt.numero : ''}`;
      abrirWhatsApp(SOPORTE_WHATSAPP, msjAdmin);
      state.msg = 'Retiro solicitado. Se abrió WhatsApp para avisarle al administrador — toca Enviar allí.'; state.saldoPanel = null; render();
    };
    wrap.appendChild(p);
  }

  // --- Mis cuentas ---
  const cbox = el(`<div class="card"><h3>Mis cuentas para retiros</h3></div>`);
  if (!ctas.length) cbox.appendChild(el(`<p class="small muted">Aún no registras cuentas. Se necesita una cuenta verificada para tu primer retiro.</p>`));
  ctas.forEach(cu => cbox.appendChild(el(`<div class="row between" style="border-bottom:1px solid var(--line);padding:6px 0">

  // --- Panel: registrar cuenta ---
  if (state.saldoPanel === 'cuenta'){

    </div>`);
    p.querySelector('#ct_x').onclick = () => { state.saldoPanel = null; render(); };
    p.querySelector('#ct_go').onclick = async (ev) => {
      const num = p.querySelector('#ct_num').value.replace(/\s+/g,'');
      if (!/^\d{6,20}$/.test(num)) return errPanel(p, 'El número de cuenta debe tener solo dígitos (entre 6 y 20).');

      const { error } = await sb.rpc('registrar_cuenta', { p_banco: p.querySelector('#ct_banco').value, p_tipo: p.querySelector('#ct_tipo').value, p_numero: num });

      state.msg = 'Cuenta enviada. El administrador la verificará.'; state.saldoPanel = null; render();
    };
    wrap.appendChild(p);
  }

  // --- Mis solicitudes ---
  const sol = [...recs.map(r => ({t:'Recarga', ...r})), ...rets.map(r => ({t:'Retiro', ...r}))]
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0,6);
  if (sol.length){
    const sbox = el(`<div class="card"><h3>Mis solicitudes</h3></div>`);
    const st = el('<table><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Estado</th></tr></table>');

    <button class="btn-acc" id="cp_go" style="width:100%">Cambiar contraseña</button></div>`);
  cpBox.querySelector('#cp_go').onclick = async (ev) => {
    const act = $('#cp_act', cpBox).value, nueva = $('#cp_new', cpBox).value, rep = $('#cp_rep', cpBox).value;
    if (!act) { state.err = 'Escribe tu contraseña actual'; return render(); }
    const e = validarClaveNueva(nueva, rep, state.profile.celular);
    if (e) { state.err = e; return render(); }
    if (nueva === act) { state.err = 'La contraseña nueva debe ser distinta a la actual'; return render(); }

    if (eAct) { state.err = 'La contraseña actual es incorrecta'; return render(); }
    const { error } = await sb.auth.updateUser({ password: nueva });
    if (error) { state.err = error.message; return render(); }
    state.err = null; state.msg = 'Contraseña cambiada correctamente';
    render();
  };
  wrap.appendChild(cpBox);

  // --- Historial de movimientos ---
  const { data: tx } = await sb.from('transactions').select('*').eq('user_id', uid)
    .order('created_at',{ascending:false}).limit(20);
  const hbox = el(`<div class="card"><h3>Últimos movimientos</h3></div>`);
  const tbl = el('<table><tr><th>Fecha</th><th>Tipo</th><th>Monto</th></tr></table>');
  (tx||[]).forEach(t => tbl.appendChild(elTr(`<tr><td class="small">${fmtDate(t.created_at)}</td>
    <td class="small">${esc(t.tipo)}</td><td class="small">${t.monto>0?'+':''}${money(t.monto)}</td></tr>`)));
  hbox.appendChild(tbl);
  wrap.appendChild(hbox);
  return wrap;
}
