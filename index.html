    const cel = $('#aj_cel',ajusteBox).value.trim();
    const montoTxt = $('#aj_monto',ajusteBox).value.trim();
    const motivo = $('#aj_motivo',ajusteBox).value.trim();
    if (!/^\d{10}$/.test(cel)) { state.err = 'El celular debe tener 10 dígitos'; return render(); }
    const monto = Number(montoTxt.replace(',', '.'));
    if (!MODO_DEMO && monto < 0) { state.err = 'En modo dinero real no se puede quitar saldo a un jugador.'; return render(); }
    if (!isFinite(monto) || isNaN(monto) || monto === 0) { state.err = 'Escribe un monto válido, distinto de 0 (puede ser negativo)'; return render(); }
    if (!motivo || motivo.length < 3) { state.err = 'Escribe un motivo (mínimo 3 caracteres)'; return render(); }
    ev.target.disabled = true; ev.target.innerHTML = '<span class="spinner"></span> Aplicando…';
    const { data: prof, error: e1 } = await sb.from('profiles').select('id,nombre,apellido').eq('celular', cel).maybeSingle();
    if (e1 || !prof) { state.err = 'No existe ningún jugador con ese celular'; return render(); }
    const { error: e2 } = await sb.rpc('admin_ajuste', { p_user: prof.id, p_monto: monto, p_motivo: motivo });
    if (e2) { state.err = e2.message; } else {
      state.msg = `${monto>0?'+':''}${money(monto)} aplicado a ${prof.nombre} ${prof.apellido}`;
      $('#aj_cel',ajusteBox).value=''; $('#aj_monto',ajusteBox).value=''; $('#aj_motivo',ajusteBox).value='';
    }
    render();
  };
  secs.jug.appendChild(ajusteBox);

  // Cuentas bancarias por verificar
  const { data: ctasPend } = await sb.from('bank_accounts')
    .select('*, profiles!bank_accounts_user_fk(nombre,apellido,cedula,celular)')
    .eq('estado','pendiente').order('created_at');
  const cbox = el(`<div class="card"><h3>Cuentas por verificar (${(ctasPend||[]).length})</h3>
    <p class="small muted">Comprueba en tu sistema del banco que el número de cuenta pertenece a esta persona (nombre y cédula).</p></div>`);
  (ctasPend||[]).forEach(ct => {
    const pr = ct.profiles || {};
    const row = el(`<div style="border-bottom:1px solid var(--line);padding:8px 0">
      <b>${esc(pr.nombre)} ${esc(pr.apellido)}</b><br>
      <span class="small muted">Cédula ${esc(pr.cedula)} · Cel ${esc(pr.celular)}</span><br>
      <span class="small"><b>${BANCO_TXT[ct.banco]||esc(ct.banco)}</b> · ${esc(ct.tipo)} · <b>${esc(ct.numero)}</b></span>
      <div class="row" style="margin-top:6px">
        <button class="btn-acc btn-sm" id="va_${ct.id}">✔ Verificar</button>
        <button class="btn-err btn-sm" id="vr_${ct.id}">✘ Rechazar</button>
      </div></div>`);
    cbox.appendChild(row);
    const accion = (ok) => async () => {
      if (!ok && !confirm('¿Rechazar esta cuenta?')) return;
      const { error } = await sb.rpc('admin_verificar_cuenta', { p_id: ct.id, p_aprobar: ok });
      if (error) state.err = error.message; else state.msg = ok ? 'Cuenta verificada' : 'Cuenta rechazada';
      await alarmaRevisar(); render();
    };
    row.querySelector('#va_'+ct.id).onclick = accion(true);
    row.querySelector('#vr_'+ct.id).onclick = accion(false);
  });
  secs.pend.appendChild(cbox);

  // Recargas pendientes (por acreditar)
  const { data: recs } = await sb.from('recharges').select('*, profiles!recharges_user_fk(nombre,apellido,celular)').eq('estado','pendiente').order('created_at');
  const rbox = el(`<div class="card"><h3>Recargas por acreditar (${(recs||[]).length})</h3></div>`);
  (recs||[]).forEach(r => {
    const row = el(`<div style="border-bottom:1px solid var(--line);padding:8px 0">
      <b>${esc(r.profiles?.nombre)} ${esc(r.profiles?.apellido)}</b> · <b>${money(r.monto)}</b><br>
      <span class="small muted">Cel ${esc(r.profiles?.celular)} · ${fmtDate(r.created_at)}</span><br>
      <span class="small">Comprobante: <b>${esc(r.comprobante_nota||'—')}</b></span>
      <div class="row" style="margin-top:6px">
        <button class="btn-acc btn-sm" id="ra_${r.id}">✔ Acreditar</button>
        <button class="btn-err btn-sm" id="rr_${r.id}">✘ Rechazar</button>
      </div></div>`);
    rbox.appendChild(row);
    const accion = (ok) => async () => {
      if (ok && !confirm(`¿Confirmas que recibiste ${money(r.monto)} y quieres acreditarlos?`)) return;
      const { error } = await sb.rpc('admin_procesar_recarga', { p_id: r.id, p_aprobar: ok });
      if (error) state.err = error.message; else state.msg = ok ? 'Recarga acreditada' : 'Recarga rechazada';
      await alarmaRevisar(); render();
    };
    row.querySelector('#ra_'+r.id).onclick = accion(true);
    row.querySelector('#rr_'+r.id).onclick = accion(false);
  });
  secs.pend.appendChild(rbox);

  // Retiros pendientes (por pagar)
  const selRet = '*, profiles!withdrawals_user_fk(nombre,apellido,cedula,celular)';
  let { data: wds, error: wErr } = await sb.from('withdrawals')
    .select(selRet + ', bank_accounts!withdrawals_cuenta_fk(banco,tipo,numero)').eq('estado','pendiente').order('created_at');
  if (wErr) ({ data: wds } = await sb.from('withdrawals').select(selRet).eq('estado','pendiente').order('created_at'));
  const wbox = el(`<div class="card"><h3>Retiros por pagar (${(wds||[]).length})</h3></div>`);
  (wds||[]).forEach(w => {
    const ct = w.bank_accounts;
    const destino = ct ? `<span class="small"><b>Depositar a:</b> ${BANCO_TXT[ct.banco]||esc(ct.banco)} · ${esc(ct.tipo)} · <b>${esc(ct.numero)}</b></span>
        <button class="btn-ghost btn-sm" id="wc_${w.id}" style="margin-left:6px">Copiar</button>`
      : `<span class="small muted">Sin cuenta registrada (retiro antiguo): coordina por WhatsApp.</span>`;
    const row = el(`<div style="border-bottom:1px solid var(--line);padding:8px 0">
      <b>${esc(w.profiles?.nombre)} ${esc(w.profiles?.apellido)}</b> · <b>${money(w.monto)}</b><br>
      <span class="small muted">Cédula ${esc(w.profiles?.cedula)} · Cel ${esc(w.profiles?.celular)} · ${fmtDate(w.created_at)}</span><br>
      ${destino}
      <div class="row" style="margin-top:6px">
        <button class="btn-acc btn-sm" id="wa_${w.id}">✔ Ya pagué</button>
        <button class="btn-err btn-sm" id="wr_${w.id}">✘ Rechazar (devuelve saldo)</button>
      </div></div>`);
    wbox.appendChild(row);
    const bcopy = row.querySelector('#wc_'+w.id);
    if (bcopy) bcopy.onclick = async () => {
      try { await navigator.clipboard.writeText(ct.numero); bcopy.textContent = '✓ Copiado'; } catch(e){ bcopy.textContent = 'No se pudo'; }
    };
    const accion = (ok) => async () => {
      const msg = ok ? `¿Ya depositaste ${money(w.monto)} a la cuenta indicada?` : `¿Rechazar el retiro? Se devolverán ${money(w.monto)} al saldo del jugador.`;
      if (!confirm(msg)) return;
      const { error } = await sb.rpc('admin_procesar_retiro', { p_id: w.id, p_aprobar: ok });
      if (error) { state.err = error.message; await alarmaRevisar(); return render(); }
      if (ok){
        state.msg = 'Retiro marcado como pagado';
        abrirWhatsApp(w.profiles?.celular, `Hola ${w.profiles?.nombre||''}, tu retiro de ${money(w.monto)} en Bingo Family ya fue procesado. Revisa tu cuenta bancaria. ✅`);
      } else {
        state.msg = 'Retiro rechazado y saldo devuelto';
      }
      await alarmaRevisar(); render();
    };
    row.querySelector('#wa_'+w.id).onclick = accion(true);
    row.querySelector('#wr_'+w.id).onclick = accion(false);
  });
  secs.pend.appendChild(wbox);

  // Partidas programadas: iniciar ya / cancelar
  const { data: prog } = await sb.from('games').select('*, rooms!games_room_fk(nombre)').eq('estado','programada').order('inicio_programado');
  const pbox = el(`<div class="card"><h3>Partidas programadas</h3></div>`);
  (prog||[]).forEach(g => {
    const row = el(`<div class="row between" style="border-bottom:1px solid var(--line);padding:8px 0">
      <div><b>${esc(g.nombre)}</b><br><span class="small muted">${fmtDate(g.inicio_programado)} · ${g.cartones_vendidos||0}/${g.max_cartones}</span></div>
      <div class="row">
        <button class="btn-warn btn-sm" id="gi_${g.id}">Iniciar ya</button>
        <button class="btn-err btn-sm" id="gc_${g.id}">Cancelar</button>
      </div></div>`);
    pbox.appendChild(row);
    row.querySelector('#gi_'+g.id).onclick = async ()=>{
      if (!confirm('¿Iniciar esta partida ahora mismo (forzando el mínimo de cartones)?')) return;
      await sb.rpc('admin_iniciar_ahora', { p_game: g.id, p_forzar: true }); render();
    };
    row.querySelector('#gc_'+g.id).onclick = async ()=>{
      if (!confirm('¿Cancelar y reembolsar esta partida?')) return;
      await sb.rpc('admin_cancelar_partida', { p_game: g.id }); render();
    };
  });
  secs.part.appendChild(pbox);

  // --- Lista de jugadores (para ver saldos demo y datos de recarga) ---
  const { data: jugadores, error: jugErr } = await sb
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(500);

  // --- Resumen rápido (con los datos ya cargados arriba en esta misma función) ---
  const totalRetiroPend = (wds||[]).reduce((s,w)=>s+Number(w.monto||0),0);
  const conSaldo = (jugadores||[]).filter(j => !j.es_admin && Number(j.saldo) > 0).length;
  const resumen = el(`<div class="card">
    <h3>Resumen rápido</h3>
    <div class="row" style="flex-wrap:wrap;gap:10px">
      <div class="pend-box" style="flex:1;min-width:140px">💵 <b>${money(totalRetiroPend)}</b><br><span class="small">retenidos en retiros pendientes</span></div>
      <div class="pend-box" style="flex:1;min-width:140px">🧪 <b>${conSaldo}</b><br><span class="small">jugador(es) con saldo > $0</span></div>
      <div class="pend-box" style="flex:1;min-width:140px">🏦 <b>${(ctasPend||[]).length}</b><br><span class="small">cuenta(s) por verificar</span></div>
    </div>
  </div>`);
  secs.jug.insertBefore(resumen, secs.jug.firstChild);

  const jbox = el(`<div class="card"><h3>Jugadores registrados (${(jugadores||[]).length})</h3>
    <p class="small muted">Sin contraseñas. Usa el celular para recargas manuales. Revisa saldos antes de pasar a dinero real.</p>
    ${jugErr ? `<div class="err-box">No se pudo cargar la lista: ${esc(jugErr.message)}</div>` : ''}
    <input id="buscar_jugador" placeholder="Buscar por celular o nombre..." style="margin-bottom:10px">
    <div id="lista_jugadores" style="max-height:440px;overflow-y:auto"></div>
  </div>`);
  const historialCache = {};
  function pintarJugadores(filtro=''){
    const cont = jbox.querySelector('#lista_jugadores');
    cont.innerHTML = '';
    const f = (filtro||'').trim().toLowerCase();
    (jugadores||[]).forEach(j=>{
      const texto = `${j.nombre||''} ${j.apellido||''} ${j.celular||''}`.toLowerCase();
      if (f && !texto.includes(f)) return;
      const adminTag = j.es_admin ? ' <span class="pill pill-wait">Admin</span>' : '';
      const susTag = (j.activo === false) ? ' <span class="pill pill-err">Suspendido</span>' : '';
      const row = el(`<div style="border-bottom:1px solid var(--line);padding:8px 0">
        <div class="row between">
          <div>
            <b>${esc(j.nombre)} ${esc(j.apellido)}</b>${adminTag}${susTag}<br>
            <span class="small muted">${esc(j.celular)||'—'} · Cédula: ${esc(j.cedula)||'—'}</span>
          </div>
          <div style="text-align:right">
            <div style="font-size:16px;font-weight:800;color:var(--acc-ink)">${money(j.saldo)}</div>
            <div class="small muted">${fmtDate(j.created_at)}</div>
          </div>
        </div>
        <div class="row" style="margin-top:6px;gap:6px;flex-wrap:wrap">
          <button class="btn-ghost btn-sm" id="jc_${j.id}">📋 Copiar celular</button>
          ${!j.es_admin ? `<button class="btn-ghost btn-sm" id="jk_${j.id}">🔑 Restablecer contraseña</button>` : ''}
          ${(MODO_DEMO && !j.es_admin && Number(j.saldo) > 0) ? `<button class="btn-err btn-sm" id="jq_${j.id}">🧹 Quitar todo el saldo</button>` : ''}
          <button class="btn-ghost btn-sm" id="jh_${j.id}">📜 Historial</button>
          ${j.es_admin ? '' : `<button class="btn-${j.activo===false?'acc':'err'} btn-sm" id="js_${j.id}">${j.activo===false?'Reactivar':'Suspender'}</button>`}
        </div>
        <div id="jhist_${j.id}" style="display:none;margin-top:8px"></div>
        <div style="margin-top:6px">
          <textarea id="jn_${j.id}" placeholder="Nota interna (solo tú la ves)" rows="2" style="width:100%;font-size:13px">${esc(j.nota_admin||'')}</textarea>
          <button class="btn-ghost btn-sm" id="jns_${j.id}" style="margin-top:4px">Guardar nota</button>
        </div>
      </div>`);
      cont.appendChild(row);
      row.querySelector('#jc_'+j.id).onclick = (ev) => copiarTexto(j.celular || '', ev.target);
      const jk = row.querySelector('#jk_'+j.id);
      if (jk) jk.onclick = async () => {
        if (!confirm(`¿Restablecer la contraseña de ${j.nombre} ${j.apellido}?\n\nHazlo solo si ya verificaste que es la persona: que te escriba desde su celular registrado (${j.celular}) y confirme su cédula.`)) return;
        busy(jk, 'Generando…');
        const { data: tmp, error } = await sb.rpc('admin_restablecer_clave', { p_user: j.id });
        if (error) { state.err = error.message; render(); return; }
        state.msg = `Contraseña temporal de ${j.nombre} ${j.apellido}: ${tmp}   (cópiala ahora; no se vuelve a mostrar)`;
        render(); window.scrollTo(0, 0);
        abrirWhatsApp(j.celular, `Hola ${j.nombre}, tu contraseña temporal de Bingo Family es: ${tmp}\nAl entrar te pedirá crear una nueva. No la compartas con nadie.`);
      };
      const jq = row.querySelector('#jq_'+j.id);
      if (jq) jq.onclick = () => {
        $('#aj_cel', ajusteBox).value = j.celular || '';
        $('#aj_monto', ajusteBox).value = (-Number(j.saldo)).toFixed(2);
        $('#aj_motivo', ajusteBox).value = 'Fin del saldo de prueba';
        ajusteBox.scrollIntoView({ behavior:'smooth', block:'center' });
      };

      row.querySelector('#jh_'+j.id).onclick = async () => {
        const box = row.querySelector('#jhist_'+j.id);
        const abierto = box.style.display !== 'none';
        if (abierto){ box.style.display = 'none'; return; }
        box.style.display = 'block';
        if (!historialCache[j.id]){
          box.innerHTML = '<p class="small muted">Cargando…</p>';
          const [rr, ww] = await Promise.all([
            sb.from('recharges').select('monto,estado,created_at').eq('user_id', j.id).order('created_at',{ascending:false}).limit(15),
            sb.from('withdrawals').select('monto,estado,created_at,cuenta_id').eq('user_id', j.id).order('created_at',{ascending:false}).limit(15)
          ]);
          historialCache[j.id] = { recs: rr.data||[], wds: ww.data||[] };
        }
        const h = historialCache[j.id];
        const items = [...h.recs.map(x=>({t:'Recarga',...x})), ...h.wds.map(x=>({t:'Retiro',...x}))]
          .sort((a,b)=> new Date(b.created_at)-new Date(a.created_at));
        box.innerHTML = items.length
          ? '<table><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Estado</th></tr>' +
            items.map(x=>`<tr><td class="small">${fmtDate(x.created_at)}</td><td class="small">${x.t}</td><td class="small">${money(x.monto)}</td><td class="small">${ESTADO_TXT[x.estado]||esc(x.estado)}</td></tr>`).join('') +
            '</table>'
          : '<p class="small muted">Sin recargas ni retiros todavía.</p>';
      };

      const btnSus = row.querySelector('#js_'+j.id);
      if (btnSus) btnSus.onclick = async () => {
        const activar = j.activo === false;
        if (!confirm(activar ? `¿Reactivar a ${j.nombre}?` : `¿Suspender a ${j.nombre}? No podrá comprar, recargar ni retirar.`)) return;
        const { error } = await sb.rpc('admin_set_activo', { p_user: j.id, p_activo: activar });
        if (error) { state.err = error.message; return render(); }
        j.activo = activar; state.msg = activar ? 'Jugador reactivado' : 'Jugador suspendido'; render();
      };

      row.querySelector('#jns_'+j.id).onclick = async (ev) => {
        busy(ev.target, 'Guardando…');
        const { error } = await sb.rpc('admin_set_nota', { p_user: j.id, p_nota: row.querySelector('#jn_'+j.id).value });
        unbusy(ev.target);
        if (error) { state.err = error.message; return render(); }
        j.nota_admin = row.querySelector('#jn_'+j.id).value;
        ev.target.textContent = '✓ Guardado'; setTimeout(()=>{ ev.target.textContent = 'Guardar nota'; }, 1500);
      };
    });
  }
  pintarJugadores();
  jbox.querySelector('#buscar_jugador').oninput = (e)=> pintarJugadores(e.target.value);
  secs.jug.appendChild(jbox);

  // Orden dentro de Pendientes: recargas, retiros y al final las cuentas por verificar
  secs.pend.appendChild(cbox);
  const nPend = (ctasPend||[]).length + (recs||[]).length + (wds||[]).length;
  const secDefs = [['pend','🔔 Pendientes', nPend], ['part','🎟️ Partidas', 0], ['jug','👥 Jugadores', 0], ['sis','⚙️ Sistema', 0]];
  if (!secs[state.adminSec]) state.adminSec = 'pend';
  const nav = el('<div class="tabs" style="margin-bottom:10px;flex-wrap:wrap"></div>');
  secDefs.forEach(([id, label, n]) => {
    const t = el(`<div class="tab ${state.adminSec===id?'active':''}">${label}${n>0 ? ` <span class="badge-n">${n}</span>` : ''}</div>`);
    t.onclick = () => { state.adminSec = id; render(); };
    nav.appendChild(t);
  });
  wrap.appendChild(nav);
  wrap.appendChild(secs[state.adminSec]);
  return wrap;
}

// ============================================================
// ALARMA DEL ADMINISTRADOR (solicitudes pendientes)
// Revisa cada 15 s si hay recargas, retiros o cuentas por atender.
// Suena, vibra, parpadea el título y muestra una barra roja fija.
// (Solo funciona mientras la app esté abierta; el navegador exige un toque
//  en la pantalla para permitir el sonido.)
// ============================================================
const alarma = { timer:null, beepTimer:null, titleTimer:null, ctx:null, total:0, rec:0, ret:0, cta:0, silenciadaEn:-1, tituloOriginal:document.title };

function alarmaDesbloquearAudio(){
  try {
    if (!alarma.ctx) alarma.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (alarma.ctx.state === 'suspended') alarma.ctx.resume();
  } catch(e){}
}
['click','touchstart','keydown'].forEach(evn => document.addEventListener(evn, () => {
  if (state.profile && state.profile.es_admin) alarmaDesbloquearAudio();
}, { passive:true }));

function alarmaBeep(){
  try {
    if (alarma.ctx && alarma.ctx.state === 'running'){
      const t0 = alarma.ctx.currentTime;
      [0, 0.25, 0.5].forEach((d, i) => {
        const o = alarma.ctx.createOscillator(), g = alarma.ctx.createGain();
        o.type = 'square'; o.frequency.value = (i === 1) ? 1040 : 880;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.2);
        o.connect(g); g.connect(alarma.ctx.destination); o.start(t0 + d); o.stop(t0 + d + 0.22);
      });
    }
  } catch(e){}
  vibrar([300,150,300]);
}

function alarmaBarra(){
  let b = document.getElementById('alarma-bar');
  const activa = state.user && state.profile && state.profile.es_admin && alarma.total > 0;
  if (!activa){ if (b) b.remove(); return; }
  if (!b){ b = document.createElement('div'); b.id = 'alarma-bar'; document.body.insertBefore(b, document.body.firstChild); }
  const audioOk = alarma.ctx && alarma.ctx.state === 'running';
  const silenciada = alarma.silenciadaEn >= alarma.total;
  b.innerHTML = `<span>🔔 <b>${alarma.total}</b> pendiente(s): ${alarma.rec} recarga(s) · ${alarma.ret} retiro(s) · ${alarma.cta} cuenta(s)</span>
    <span class="row"><button class="btn-sm" id="al_ver">Ver</button>
      <button class="btn-sm" id="al_mute">${silenciada ? '🔕 Silenciada' : 'Silenciar'}</button>
      ${audioOk ? '' : '<button class="btn-sm" id="al_snd">🔊 Activar sonido</button>'}</span>`;
  b.querySelector('#al_ver').onclick = () => { state.adminSec = 'pend'; setView('admin'); };
  b.querySelector('#al_mute').onclick = () => { alarma.silenciadaEn = alarma.total; alarmaBarra(); };
  const snd = b.querySelector('#al_snd');
  if (snd) snd.onclick = () => { alarmaDesbloquearAudio(); setTimeout(() => { alarmaBeep(); alarmaBarra(); }, 150); };
}

function alarmaTitulo(){
  if (alarma.titleTimer){ clearInterval(alarma.titleTimer); alarma.titleTimer = null; }
  if (alarma.total > 0 && state.profile && state.profile.es_admin){
    let on = false;
    alarma.titleTimer = setInterval(() => { on = !on; document.title = on ? `🔔 (${alarma.total}) Pendientes` : alarma.tituloOriginal; }, 1000);
  } else { document.title = alarma.tituloOriginal; }
}

async function alarmaRevisar(){
  if (!state.user || !state.profile || !state.profile.es_admin) return;
  try {
    const q = (t) => sb.from(t).select('id', { count:'exact', head:true }).eq('estado','pendiente');
    const [a, b, cc] = await Promise.all([q('recharges'), q('withdrawals'), q('bank_accounts')]);
    const rec = a.count || 0, ret = b.count || 0, cta = cc.count || 0, total = rec + ret + cta;
    const subio = total > alarma.total;
    Object.assign(alarma, { rec, ret, cta, total });
    const bd = document.getElementById('tab_admin_badge'); if (bd){ bd.textContent = total; bd.style.display = total > 0 ? '' : 'none'; }
    if (total === 0) alarma.silenciadaEn = -1;
    if (subio && alarma.silenciadaEn < total) alarmaBeep();
    alarmaBarra(); alarmaTitulo();
    const editando = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (subio && state.view === 'admin' && !editando) render();
  } catch(e){}
}

function iniciarAlarmaAdmin(){
  detenerAlarmaAdmin();
  if (!state.profile || !state.profile.es_admin) return;
  alarmaRevisar();
  alarma.timer = setInterval(alarmaRevisar, 15000);
  alarma.beepTimer = setInterval(() => { if (alarma.total > 0 && alarma.silenciadaEn < alarma.total) alarmaBeep(); }, 8000);
}
function detenerAlarmaAdmin(){
  ['timer','beepTimer','titleTimer'].forEach(k => { if (alarma[k]){ clearInterval(alarma[k]); alarma[k] = null; } });
  alarma.total = alarma.rec = alarma.ret = alarma.cta = 0; alarma.silenciadaEn = -1;
  const b = document.getElementById('alarma-bar'); if (b) b.remove();
  document.title = alarma.tituloOriginal;
}

// ============================================================
// INICIO
// ============================================================
function ponerOjitos(root){
  (root || document).querySelectorAll('input[type="password"]:not([data-ojo])').forEach(inp => {
    inp.dataset.ojo = '1';
    const w = document.createElement('div');
    w.style.cssText = 'position:relative;margin-bottom:10px';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    inp.style.marginBottom = '0'; inp.style.paddingRight = '48px';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ojito'; b.textContent = '👁'; b.setAttribute('aria-label', 'Mostrar u ocultar la contraseña');
    b.onclick = () => { const ver = inp.type === 'password'; inp.type = ver ? 'text' : 'password'; b.textContent = ver ? '🙈' : '👁'; };
    w.appendChild(b);
  });
}
new MutationObserver(() => ponerOjitos(document.getElementById('app'))).observe(document.getElementById('app') || document.body, { childList:true, subtree:true });

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) { await afterLogin(session.user); }
  else { state.view='auth'; render(); }
})();
</script>
